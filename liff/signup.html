<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Prinnie333 — ลงทะเบียนดวง</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun','Noto Sans Thai',sans-serif;
      background: linear-gradient(135deg,#1a0533 0%,#2d0a5a 100%);
      min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
      padding: 24px 16px; color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
      padding: 32px 24px; width: 100%; max-width: 440px;
    }
    .logo { text-align:center; font-size:1.8rem; font-weight:700; letter-spacing:2px; color:#e8c4f7; margin-bottom:4px; }
    .subtitle { text-align:center; font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:26px; }
    label { display:block; font-size:0.85rem; color:rgba(255,255,255,0.78); margin-bottom:6px; margin-top:4px; }
    .hint { font-size:0.72rem; color:rgba(255,255,255,0.45); margin:-12px 0 16px; }
    input {
      width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.2);
      background:rgba(255,255,255,0.08); color:#fff; font-size:1rem; margin-bottom:18px; outline:none;
      transition:border-color .2s;
    }
    input::placeholder { color:rgba(255,255,255,0.35); }
    input:focus { border-color:#c77dff; }
    input:disabled { opacity:0.4; }
    .checkrow { display:flex; align-items:center; gap:8px; margin:-10px 0 18px; }
    .checkrow input { width:auto; margin:0; }
    .checkrow label { margin:0; font-size:0.85rem; }
    .btn {
      width:100%; padding:14px; border-radius:12px; border:none;
      background:linear-gradient(90deg,#9b59b6,#c77dff); color:#fff; font-size:1rem;
      font-weight:600; cursor:pointer; transition:opacity .2s; letter-spacing:.5px;
    }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-ghost { background:rgba(255,255,255,0.1); margin-top:12px; }
    .error { background:rgba(255,80,80,0.15); border:1px solid rgba(255,80,80,0.4); border-radius:10px;
             padding:12px 14px; font-size:0.85rem; margin-bottom:16px; display:none; }
    .step { display:none; } .step.active { display:block; }
    #loading { text-align:center; padding:40px 0; color:rgba(255,255,255,0.6); font-size:0.9rem; }
    .spinner { width:36px; height:36px; border:3px solid rgba(199,125,255,0.3); border-top-color:#c77dff;
               border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .chartbox { background:rgba(199,125,255,0.15); border:1px solid rgba(199,125,255,0.4);
                border-radius:14px; padding:20px; margin-bottom:20px; }
    .chartrow { display:flex; justify-content:space-between; padding:6px 0; font-size:1rem; border-bottom:1px solid rgba(255,255,255,0.08); }
    .chartrow:last-child { border:none; }
    .chartrow .v { color:#e8c4f7; font-weight:700; }
    .success-icon { font-size:3rem; text-align:center; margin-bottom:12px; }
    .success-title { font-size:1.3rem; font-weight:700; text-align:center; color:#e8c4f7; margin-bottom:8px; }
    .success-body { text-align:center; color:rgba(255,255,255,0.7); font-size:0.9rem; line-height:1.6; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">✦ PRINNIE333</div>
  <div class="subtitle">ลงทะเบียนวันเกิด เพื่อรับดวงส่วนตัว</div>

  <div id="loading"><div class="spinner"></div>กำลังโหลด...</div>

  <!-- Step 1: ฟอร์มข้อมูลเกิด -->
  <div class="step" id="step-form">
    <div class="error" id="form-error"></div>

    <label>ชื่อเล่น</label>
    <input type="text" id="nickname" placeholder="เช่น บอน" maxlength="50" />

    <label>วันเกิด</label>
    <input type="date" id="birth_date" />

    <label>เวลาเกิด</label>
    <input type="time" id="birth_time" />
    <div class="checkrow">
      <input type="checkbox" id="time_unknown" onchange="toggleTime()" />
      <label for="time_unknown">ไม่ทราบเวลาเกิด (จะคำนวณลัคนาไม่ได้)</label>
    </div>

    <label>สถานที่เกิด (จังหวัด/เมือง)</label>
    <input type="text" id="birth_place" placeholder="เช่น กรุงเทพมหานคร" />
    <div class="hint">ใช้คำนวณลัคนาและ timezone — พิมพ์ชื่อจังหวัดหรือเมืองได้เลย</div>

    <button class="btn" id="btn-submit" onclick="submitForm()">คำนวณดวงของฉัน →</button>
    <button class="btn btn-ghost" id="btn-goto-couple" style="display:none" onclick="showStep('step-couple-form')">💞 ดูดวงคู่กับคนพิเศษ</button>
  </div>

  <!-- Step 2: ผลดวง + สมัคร -->
  <div class="step" id="step-result">
    <div class="chartbox" id="chartbox"></div>
    <button class="btn" id="payBtn" onclick="goToPayment()">สมัครสมาชิก 399 บาท/เดือน →</button>
    <button class="btn btn-ghost" onclick="showStep('step-form')">แก้ไขข้อมูลเกิด</button>
  </div>

  <!-- Step 3: สำเร็จ -->
  <div class="step" id="step-success">
    <div class="success-icon">✨</div>
    <div class="success-title" id="success-title">ลงทะเบียนสำเร็จ!</div>
    <div class="success-body" id="success-body">ดวงส่วนตัวจะถูกส่งทุกเช้า 08:00 น.<br/>ปิดหน้าต่างนี้ได้เลย</div>
  </div>

  <!-- Step 4: ฟอร์มผูกดวงคู่ -->
  <div class="step" id="step-couple-form">
    <div style="text-align:center;font-size:1.1rem;font-weight:700;color:#e8c4f7;margin-bottom:4px;">💞 ผูกดวงคู่</div>
    <div class="hint" style="text-align:center;margin:0 0 18px;">กรอกวันเกิดของคนพิเศษ เพื่อดูความเข้ากันกับดวงของคุณ</div>
    <div class="error" id="couple-error"></div>

    <label>ชื่อเล่นของคู่</label>
    <input type="text" id="c_nickname" placeholder="เช่น มายด์" maxlength="50" />

    <label>วันเกิดของคู่</label>
    <input type="date" id="c_birth_date" />

    <label>เวลาเกิดของคู่</label>
    <input type="time" id="c_birth_time" />
    <div class="checkrow">
      <input type="checkbox" id="c_time_unknown" onchange="toggleCoupleTime()" />
      <label for="c_time_unknown">ไม่ทราบเวลาเกิดของคู่</label>
    </div>

    <label>สถานที่เกิดของคู่ (จังหวัด/เมือง)</label>
    <input type="text" id="c_birth_place" placeholder="เช่น กรุงเทพมหานคร" />

    <button class="btn" id="btn-couple-submit" onclick="submitCouple()">ดูดวงคู่ของเรา 💞</button>
    <button class="btn btn-ghost" onclick="showStep('step-form')">← กลับ</button>
  </div>

  <!-- Step 5: ผลดวงคู่ -->
  <div class="step" id="step-couple-result">
    <div class="chartbox" id="couplebox"></div>
    <button class="btn btn-ghost" onclick="showStep('step-couple-form')">↺ ลองคู่อื่น</button>
    <button class="btn btn-ghost" onclick="closeLiff()">ปิดหน้านี้</button>
  </div>
</div>

<script>
  const BACKEND_URL = 'https://prinnie-app-production.up.railway.app';
  const LIFF_ID     = '2010382680-c6gh82Rm';  // LINE Login channel (classic LIFF)

  let profile = null;
  let isActiveMember = false;   // เป็นสมาชิกที่ใช้งานอยู่ → โหมดแก้ไข (ไม่ต้องจ่ายซ้ำ)

  async function initLiff() {
    await liff.init({ liffId: LIFF_ID });
    // ใน LINE app ไม่ต้อง login (มี session อยู่แล้ว) — เรียก login เฉพาะเปิดนอกแอป
    if (!liff.isLoggedIn() && !liff.isInClient()) {
      liff.login({ redirectUri: location.href });
      return;
    }
    profile = await liff.getProfile();

    // เติมชื่อเล่นจาก LINE เป็นค่าเริ่มต้น
    document.getElementById('nickname').value = profile.displayName || '';

    // เช็กสถานะสมาชิก + ดึงข้อมูลเกิดเดิมมา prefill (ให้แก้ไขได้ตลอด)
    let hasChart = false;
    try {
      const r = await fetch(`${BACKEND_URL}/api/line/member-status`, { headers: authHeaders() });
      const s = await r.json();
      if (s.status && s.status !== 'NOT_FOUND') {
        prefillForm(s);
        hasChart = !!s.has_chart;
        isActiveMember = (s.status === 'ACTIVE');
        // ปรับหัวข้อให้รู้ว่ากำลังแก้ไขข้อมูลเดิม
        document.querySelector('.subtitle').textContent =
          isActiveMember ? 'แก้ไขข้อมูลวันเกิดของคุณ' : 'ตรวจสอบ/แก้ไขข้อมูลแล้วสมัครต่อ';
        if (isActiveMember) {
          document.getElementById('btn-submit').textContent = 'บันทึกการแก้ไข →';
        }
      }
    } catch (_) {}

    // มีดวงแล้ว → โชว์ปุ่มเข้าผูกดวงคู่
    if (hasChart) document.getElementById('btn-goto-couple').style.display = '';

    // เปิดมาจากชิป/ปุ่ม "ดูดวงคู่" (?view=couple) → ไปฟอร์มคู่ทันที (ถ้ามีดวงแล้ว)
    if (getView() === 'couple') {
      if (hasChart) { showStep('step-couple-form'); return; }
      showError('กรุณาลงทะเบียนดวงของคุณก่อน แล้วจึงผูกดวงคู่ได้');
    }

    showStep('step-form');
  }

  // อ่านพารามิเตอร์ view จาก URL (รองรับทั้ง location.search และ liff.state)
  function getView() {
    try {
      const direct = new URLSearchParams(location.search).get('view');
      if (direct) return direct;
      const stateRaw = new URLSearchParams(location.search).get('liff.state');
      if (stateRaw) {
        const q = decodeURIComponent(stateRaw).split('?')[1] || '';
        return new URLSearchParams(q).get('view');
      }
    } catch (_) {}
    return null;
  }

  function closeLiff() { try { liff.closeWindow(); } catch (_) {} }

  // แนบ LINE access token ให้ backend verify ตัวตน (กันคนอื่นเข้าถึงข้อมูลเรา)
  function authHeaders(extra) {
    const t = (typeof liff !== 'undefined' && liff.getAccessToken) ? liff.getAccessToken() : null;
    return Object.assign({ 'Authorization': 'Bearer ' + t }, extra || {});
  }

  // เติมข้อมูลเกิดเดิมลงฟอร์ม
  function prefillForm(s) {
    if (s.nickname)    document.getElementById('nickname').value   = s.nickname;
    if (s.birth_date)  document.getElementById('birth_date').value = s.birth_date;
    if (s.birth_place) document.getElementById('birth_place').value = s.birth_place;
    // เวลาเกิด: ถ้าไม่ทราบเวลา → ติ๊ก checkbox + disable
    if (s.birth_time_known === false || !s.birth_time) {
      document.getElementById('time_unknown').checked = true;
      toggleTime();
    } else {
      document.getElementById('birth_time').value = s.birth_time;
    }
  }

  function toggleTime() {
    const unknown = document.getElementById('time_unknown').checked;
    const t = document.getElementById('birth_time');
    t.disabled = unknown;
    if (unknown) t.value = '';
  }

  async function submitForm() {
    const nickname    = document.getElementById('nickname').value.trim();
    const birth_date  = document.getElementById('birth_date').value;
    const unknown     = document.getElementById('time_unknown').checked;
    const birth_time  = unknown ? null : document.getElementById('birth_time').value;
    const birth_place = document.getElementById('birth_place').value.trim();

    if (!birth_date)  return showError('กรุณาเลือกวันเกิด');
    if (!birth_place) return showError('กรุณากรอกสถานที่เกิด');
    if (!unknown && !birth_time) return showError('กรุณากรอกเวลาเกิด หรือเลือก "ไม่ทราบเวลา"');

    const btn = document.getElementById('btn-submit');
    btn.disabled = true; btn.textContent = 'กำลังคำนวณ...';

    try {
      const r = await fetch(`${BACKEND_URL}/api/line/signup`, {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ nickname, birth_date, birth_time, birth_place }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');

      renderChart(data.chart, nickname);
      const payBtn = document.getElementById('payBtn');
      if (isActiveMember) {
        // สมาชิกเดิมแก้ข้อมูล — ดวงคำนวณใหม่แล้ว ไม่ต้องจ่ายซ้ำ
        payBtn.textContent = '✅ บันทึกแล้ว — ปิดหน้านี้';
        payBtn.onclick = () => { try { liff.closeWindow(); } catch (_) {} };
        document.getElementById('chartbox').insertAdjacentHTML('beforeend',
          '<div style="text-align:center;margin-top:14px;color:#9be89b;font-size:0.88rem">✅ อัปเดตข้อมูลวันเกิดเรียบร้อย<br/>ดวงถูกคำนวณใหม่แล้ว</div>');
      } else if (data.free_access || data.sub_status === 'ACTIVE') {
        // โหมดเทสฟรี: เปิดใช้งานแล้ว ไม่ต้องจ่าย
        payBtn.textContent = '✅ เริ่มใช้งานเลย';
        payBtn.onclick = () => { try { liff.closeWindow(); } catch (_) {} };
        document.getElementById('chartbox').insertAdjacentHTML('beforeend',
          '<div style="text-align:center;margin-top:14px;color:#9be89b;font-size:0.88rem">🎉 เปิดใช้งานฟรี (ช่วงทดสอบ)<br/>ปิดหน้านี้แล้วกดเมนูดูดวงได้เลย</div>');
      }
      showStep('step-result');
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = isActiveMember ? 'บันทึกการแก้ไข →' : 'คำนวณดวงของฉัน →';
    }
  }

  function renderChart(c, nickname) {
    document.getElementById('chartbox').innerHTML = `
      <div style="text-align:center;font-weight:700;color:#e8c4f7;margin-bottom:14px;">
        🌟 ดวงกำเนิดของ ${nickname || 'คุณ'}
      </div>
      <div class="chartrow"><span>☀️ อาทิตย์</span><span class="v">${signTH(c.sun)}</span></div>
      <div class="chartrow"><span>🌙 จันทร์</span><span class="v">${signTH(c.moon)}</span></div>
      <div class="chartrow"><span>⬆️ ลัคนา</span><span class="v">${c.rising ? signTH(c.rising) : 'ไม่ระบุ (ไม่ทราบเวลา)'}</span></div>
      <div class="chartrow"><span>🔢 เลขชีวิต</span><span class="v">${c.life_path}</span></div>`;
  }

  const TH = { Aries:'เมษ',Taurus:'พฤษภ',Gemini:'เมถุน',Cancer:'กรกฎ',Leo:'สิงห์',Virgo:'กันย์',
               Libra:'ตุลย์',Scorpio:'พิจิก',Sagittarius:'ธนู',Capricorn:'มังกร',Aquarius:'กุมภ์',Pisces:'มีน' };
  function signTH(s) { return s ? (TH[s] || s) : '-'; }

  // ───────── ผูกดวงคู่ ─────────
  function toggleCoupleTime() {
    const unknown = document.getElementById('c_time_unknown').checked;
    const t = document.getElementById('c_birth_time');
    t.disabled = unknown;
    if (unknown) t.value = '';
  }

  async function submitCouple() {
    const name    = document.getElementById('c_nickname').value.trim();
    const bd      = document.getElementById('c_birth_date').value;
    const unknown = document.getElementById('c_time_unknown').checked;
    const bt      = unknown ? null : document.getElementById('c_birth_time').value;
    const bp      = document.getElementById('c_birth_place').value.trim();

    const errEl = document.getElementById('couple-error'); errEl.style.display = 'none';
    if (!bd) { errEl.textContent = 'กรุณาเลือกวันเกิดของคู่'; errEl.style.display = 'block'; return; }
    if (!bp) { errEl.textContent = 'กรุณากรอกสถานที่เกิดของคู่'; errEl.style.display = 'block'; return; }
    if (!unknown && !bt) { errEl.textContent = 'กรุณากรอกเวลาเกิด หรือเลือก "ไม่ทราบเวลา"'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('btn-couple-submit');
    btn.disabled = true; btn.textContent = 'กำลังผูกดวง...';
    try {
      const r = await fetch(`${BACKEND_URL}/api/line/synastry`, {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ partner_name: name, birth_date: bd, birth_time: bt, birth_place: bp }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
      renderCouple(data);
      showStep('step-couple-result');
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'ดูดวงคู่ของเรา 💞';
    }
  }

  function renderCouple(d) {
    const pname = d.partner_name || 'คู่ของคุณ';
    const rows = `
      <div class="chartrow"><span>☀️ อาทิตย์</span><span class="v">${signTH(d.me.sun)} · ${signTH(d.partner.sun)}</span></div>
      <div class="chartrow"><span>🌙 จันทร์</span><span class="v">${signTH(d.me.moon)} · ${signTH(d.partner.moon)}</span></div>
      <div class="chartrow"><span>⬆️ ลัคนา</span><span class="v">${d.me.rising ? signTH(d.me.rising) : '-'} · ${d.partner.rising ? signTH(d.partner.rising) : '-'}</span></div>`;
    let body;
    if (d.reading && d.reading.has_content) {
      body = d.reading.aspects.map(a =>
        `<div style="padding:10px 0;border-top:1px solid rgba(255,255,255,0.1);font-size:0.92rem;line-height:1.6;color:rgba(255,255,255,0.9);">💫 ${a.text}</div>`
      ).join('');
    } else {
      body = '<div style="padding:14px 0;text-align:center;color:rgba(255,255,255,0.7);font-size:0.9rem;">ดวงของคุณสองคนค่อนข้างเป็นกลาง ✨<br/>ไม่มีมุมเด่นพิเศษระหว่างกัน</div>';
    }
    document.getElementById('couplebox').innerHTML = `
      <div style="text-align:center;font-weight:700;color:#e8c4f7;margin-bottom:12px;">💞 ดวงคู่: คุณ × ${pname}</div>
      <div style="text-align:center;font-size:0.72rem;color:rgba(255,255,255,0.45);margin-bottom:8px;">(คุณ · ${pname})</div>
      ${rows}${body}`;
  }

  async function goToPayment() {
    const btn = document.getElementById('payBtn');
    btn.disabled = true; btn.textContent = 'กำลังเปิดหน้าจ่ายเงิน...';
    try {
      const r = await fetch(`${BACKEND_URL}/api/payment/create-checkout`, {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({}),
      });
      const d = await r.json();
      if (!r.ok || !d.url) throw new Error(d.error || 'สร้างหน้าจ่ายเงินไม่สำเร็จ');
      liff.openWindow({ url: d.url, external: true });   // เปิด Stripe ในเบราว์เซอร์
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'สมัครสมาชิก 399 บาท/เดือน →';
    }
  }

  function setSuccess(title, body) {
    document.getElementById('success-title').textContent = title;
    document.getElementById('success-body').textContent  = body;
    showStep('step-success');
  }
  function showStep(id) {
    document.getElementById('loading').style.display = 'none';
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function showError(msg) {
    const el = document.getElementById('form-error');
    el.textContent = msg; el.style.display = 'block';
  }

  initLiff().catch(err => {
    const msg = (err && (err.message || err.code)) ? (err.message || err.code) : String(err);
    document.body.innerHTML =
      '<div style="padding:28px;color:#fff;font-family:sans-serif;background:#2d0a5a;min-height:100vh">' +
      '<h3 style="color:#e8c4f7">⚠️ เกิดข้อผิดพลาด</h3><p style="word-break:break-all">' + msg + '</p></div>';
  });
</script>
</body>
</html>
