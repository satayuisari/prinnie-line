<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2500" height="1686" viewBox="0 0 2500 1686"
     font-family="'Leelawadee UI','Tahoma','Noto Sans Thai',sans-serif">
  <!-- โปร่งใส: composite ทับ bg.png (นีบิวลา) ด้วย USE_BG=1 -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#fff7e2"/>
      <stop offset="32%"  stop-color="#f3d98f"/>
      <stop offset="66%"  stop-color="#d8af58"/>
      <stop offset="100%" stop-color="#b07e34"/>
    </linearGradient>
    <!-- การ์ดฝ้า: ลดความฟุ้งของนีบิวลาหลังปุ่ม ให้ไอคอน/ตัวอักษรอ่านง่าย -->
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a1246" stop-opacity="0.40"/>
      <stop offset="55%"  stop-color="#1a0a34" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#100426" stop-opacity="0.62"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f3d488" stop-opacity="0.22"/>
      <stop offset="70%"  stop-color="#f3d488" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f3d488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ════ ELEGANT FRAME ════ -->
  <rect x="46" y="46" width="2408" height="1594" rx="26" fill="none"
        stroke="url(#gold)" stroke-width="3" stroke-opacity="0.55"/>
  <rect x="62" y="62" width="2376" height="1562" rx="18" fill="none"
        stroke="#f3d488" stroke-width="1" stroke-opacity="0.28"/>
  <g fill="url(#gold)" opacity="0.85">
    <g transform="translate(46,46) rotate(45)"><rect x="-9" y="-9" width="18" height="18"/></g>
    <g transform="translate(2454,46) rotate(45)"><rect x="-9" y="-9" width="18" height="18"/></g>
    <g transform="translate(46,1640) rotate(45)"><rect x="-9" y="-9" width="18" height="18"/></g>
    <g transform="translate(2454,1640) rotate(45)"><rect x="-9" y="-9" width="18" height="18"/></g>
  </g>

  <!-- ════ FROSTED CARDS (6) ════ -->
  <g stroke="url(#gold)" stroke-width="2.5" stroke-opacity="0.5">
    <rect x="98"   y="104" width="637" height="648" rx="42" fill="url(#cardFill)"/>
    <rect x="931"  y="104" width="638" height="648" rx="42" fill="url(#cardFill)"/>
    <rect x="1765" y="104" width="637" height="648" rx="42" fill="url(#cardFill)"/>
    <rect x="98"   y="934" width="637" height="648" rx="42" fill="url(#cardFill)"/>
    <rect x="931"  y="934" width="638" height="648" rx="42" fill="url(#cardFill)"/>
    <rect x="1765" y="934" width="637" height="648" rx="42" fill="url(#cardFill)"/>
  </g>

  <!-- soft glow behind each icon -->
  <g>
    <circle cx="416.5"  cy="350"  r="170" fill="url(#iconGlow)"/>
    <circle cx="1250"   cy="350"  r="170" fill="url(#iconGlow)"/>
    <circle cx="2083.5" cy="350"  r="170" fill="url(#iconGlow)"/>
    <circle cx="416.5"  cy="1188" r="170" fill="url(#iconGlow)"/>
    <circle cx="1250"   cy="1188" r="170" fill="url(#iconGlow)"/>
    <circle cx="2083.5" cy="1188" r="170" fill="url(#iconGlow)"/>
  </g>

  <!-- ════ ICONS (row 1) ════ -->
  <!-- 1. ดูดวงวันนี้ : slim crescent + star in the cradle -->
  <g transform="translate(404,332) scale(0.92)">
    <path fill="url(#gold)" fill-rule="evenodd"
          d="M 0 0 m -92 0 a 92 92 0 1 0 184 0 a 92 92 0 1 0 -184 0
             M 48 0 m -88 0 a 88 88 0 1 0 176 0 a 88 88 0 1 0 -176 0"/>
    <g transform="translate(56,2)"><path d="M0,-30 l9,22 23,8 -23,8 -9,22 -9,-22 -23,-8 23,-8 z" fill="url(#gold)"/></g>
  </g>
  <!-- 2. พื้นดวงของฉัน : sun (refined rays) -->
  <g transform="translate(1250,330) scale(0.92)">
    <circle r="44" fill="url(#gold)"/>
    <circle r="58" fill="none" stroke="url(#gold)" stroke-width="5" stroke-opacity="0.6"/>
    <g fill="url(#gold)">
      <g><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
      <g transform="rotate(45)"><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
      <g transform="rotate(90)"><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
      <g transform="rotate(135)"><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
      <g transform="rotate(180)"><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
      <g transform="rotate(225)"><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
      <g transform="rotate(270)"><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
      <g transform="rotate(315)"><path d="M-9,-72 L9,-72 L0,-104 Z"/></g>
    </g>
  </g>
  <!-- 3. ไพ่ทาโรต์ : tidy three-card fan with star -->
  <g transform="translate(2083.5,332) scale(0.92)">
    <g fill="#160a30" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round">
      <g transform="rotate(-20) translate(-6,0)"><rect x="-44" y="-64" width="88" height="128" rx="12"/></g>
      <g transform="rotate(20) translate(6,0)"><rect x="-44" y="-64" width="88" height="128" rx="12"/></g>
      <rect x="-48" y="-74" width="96" height="148" rx="14"/>
    </g>
    <path d="M0,-30 l8,21 21,8 -21,8 -8,21 -8,-21 -21,-8 21,-8 z" fill="url(#gold)"/>
  </g>

  <!-- ════ ICONS (row 2) ════ -->
  <!-- 4. ผูกดวงคู่ : two clean interlocked hearts -->
  <g transform="translate(416.5,1176) scale(0.9)">
    <g fill="url(#gold)" stroke="#160a30" stroke-width="6" stroke-linejoin="round">
      <g transform="translate(-30,-2) rotate(-10)"><path d="M0,24 C-26,-20 -78,10 0,68 C78,10 26,-20 0,24 Z"/></g>
      <g transform="translate(30,12) rotate(10)"><path d="M0,24 C-26,-20 -78,10 0,68 C78,10 26,-20 0,24 Z"/></g>
    </g>
  </g>
  <!-- 5. สมัคร / ต่ออายุ : faceted gem -->
  <g transform="translate(1250,1166) scale(0.92)">
    <path d="M-42,-72 L42,-72 L86,-26 L0,82 L-86,-26 Z" fill="url(#gold)"/>
    <g stroke="#160a30" stroke-width="5" fill="none" stroke-linejoin="round">
      <line x1="-86" y1="-26" x2="86" y2="-26"/>
      <path d="M-42,-72 L-18,-26 L0,82 L18,-26 L42,-72"/>
    </g>
  </g>
  <!-- 6. โปรไฟล์ของฉัน : person -->
  <g transform="translate(2083.5,1166) scale(0.92)">
    <circle cx="0" cy="-44" r="40" fill="url(#gold)"/>
    <path d="M-66,82 C-66,18 -34,6 0,6 C34,6 66,18 66,82 Z" fill="url(#gold)"/>
  </g>

  <!-- ════ LABELS ════ -->
  <g text-anchor="middle" font-size="66" font-weight="600" letter-spacing="2"
     fill="#f7edcf" stroke="#120622" stroke-width="6" paint-order="stroke" stroke-linejoin="round">
    <text x="416.5"  y="585">ดูดวงวันนี้</text>
    <text x="1250"   y="585">พื้นดวงของฉัน</text>
    <text x="2083.5" y="585">ไพ่ทาโรต์</text>
    <text x="416.5"  y="1418">ผูกดวงคู่</text>
    <text x="1250"   y="1418">สมัคร / ต่ออายุ</text>
    <text x="2083.5" y="1418">โปรไฟล์ของฉัน</text>
  </g>
  <g fill="url(#gold)" opacity="0.8">
    <g transform="translate(416.5,628) rotate(45)"><rect x="-6" y="-6" width="12" height="12"/></g>
    <g transform="translate(1250,628) rotate(45)"><rect x="-6" y="-6" width="12" height="12"/></g>
    <g transform="translate(2083.5,628) rotate(45)"><rect x="-6" y="-6" width="12" height="12"/></g>
    <g transform="translate(416.5,1461) rotate(45)"><rect x="-6" y="-6" width="12" height="12"/></g>
    <g transform="translate(1250,1461) rotate(45)"><rect x="-6" y="-6" width="12" height="12"/></g>
    <g transform="translate(2083.5,1461) rotate(45)"><rect x="-6" y="-6" width="12" height="12"/></g>
  </g>
</svg>
