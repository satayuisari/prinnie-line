<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2500" height="1686" viewBox="0 0 2500 1686"
     font-family="'Leelawadee UI','Tahoma','Noto Sans Thai',sans-serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff4d6"/>
      <stop offset="50%" stop-color="#f0d488"/>
      <stop offset="100%" stop-color="#cda14e"/>
    </linearGradient>
    <radialGradient id="darkbehind" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#140428" stop-opacity="0.66"/>
      <stop offset="60%" stop-color="#140428" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#140428" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- พื้นหลัง AI ใส่โดย sharp ตอน composite — เลเยอร์นี้โปร่งใส -->
  <rect width="2500" height="1686" fill="#1a0533" opacity="0.25"/>

  <!-- เส้นแบ่ง 6 ช่อง (ตรง tap zone) -->
  <g stroke="#f0d488" stroke-opacity="0.28" stroke-width="2">
    <line x1="833.33"  y1="120" x2="833.33"  y2="1566"/>
    <line x1="1666.67" y1="120" x2="1666.67" y2="1566"/>
    <line x1="120" y1="843" x2="2380" y2="843"/>
  </g>

  <!-- วงมืดหลังไอคอน (เพิ่ม contrast) -->
  <g>
    <circle cx="416.5"  cy="380" r="240" fill="url(#darkbehind)"/>
    <circle cx="1250"   cy="380" r="240" fill="url(#darkbehind)"/>
    <circle cx="2083.5" cy="380" r="240" fill="url(#darkbehind)"/>
    <circle cx="416.5"  cy="1223" r="240" fill="url(#darkbehind)"/>
    <circle cx="1250"   cy="1223" r="240" fill="url(#darkbehind)"/>
    <circle cx="2083.5" cy="1223" r="240" fill="url(#darkbehind)"/>
  </g>

  <!-- ════ ICONS แถวบน ════ -->
  <!-- 1. ดูดวงวันนี้ : จันทร์เสี้ยว (วงกลมซ้อน evenodd) + ดาว -->
  <g transform="translate(416.5,330)">
    <path fill="url(#gold)" fill-rule="evenodd"
          d="M -6 0 m -80 0 a 80 80 0 1 0 160 0 a 80 80 0 1 0 -160 0
             M 36 0 m -66 0 a 66 66 0 1 0 132 0 a 66 66 0 1 0 -132 0"/>
    <path d="M82,-44 l8,22 22,8 -22,8 -8,22 -8,-22 -22,-8 22,-8 z" fill="url(#gold)"/>
  </g>
  <!-- 2. พื้นดวงของฉัน : อาทิตย์ -->
  <g transform="translate(1250,330)">
    <circle r="46" fill="url(#gold)"/>
    <g stroke="url(#gold)" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-70" x2="0" y2="-98"/><line x1="0" y1="70" x2="0" y2="98"/>
      <line x1="-70" y1="0" x2="-98" y2="0"/><line x1="70" y1="0" x2="98" y2="0"/>
      <line x1="-52" y1="-52" x2="-72" y2="-72"/><line x1="52" y1="-52" x2="72" y2="-72"/>
      <line x1="-52" y1="52" x2="-72" y2="72"/><line x1="52" y1="52" x2="72" y2="72"/>
    </g>
  </g>
  <!-- 3. ไพ่ทาโรต์ : ไพ่ 3 ใบ -->
  <g transform="translate(2083.5,330)">
    <g fill="#2d0a5a" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round">
      <g transform="rotate(-18)"><rect x="-46" y="-66" width="92" height="132" rx="12"/></g>
      <g transform="rotate(18)"><rect x="-46" y="-66" width="92" height="132" rx="12"/></g>
      <g transform="rotate(0)"><rect x="-48" y="-74" width="96" height="148" rx="12"/></g>
    </g>
    <path d="M0,-34 l8,22 22,8 -22,8 -8,22 -8,-22 -22,-8 22,-8 z" fill="url(#gold)"/>
  </g>

  <!-- ════ ICONS แถวล่าง ════ -->
  <!-- 4. ผูกดวงคู่ : หัวใจคู่ -->
  <g transform="translate(416.5,1200)">
    <g fill="url(#gold)" stroke="#2d0a5a" stroke-width="6" stroke-linejoin="round">
      <path transform="translate(-36,-12) scale(0.9)" d="M0,22 C-30,-28 -94,4 0,76 C94,4 30,-28 0,22 Z"/>
      <path transform="translate(36,10) scale(0.9)"   d="M0,22 C-30,-28 -94,4 0,76 C94,4 30,-28 0,22 Z"/>
    </g>
  </g>
  <!-- 5. สมัคร / ต่ออายุ : เพชร -->
  <g transform="translate(1250,1173)">
    <path d="M-42,-72 L42,-72 L86,-26 L0,82 L-86,-26 Z" fill="url(#gold)"/>
    <g stroke="#2d0a5a" stroke-width="5" fill="none" stroke-linejoin="round">
      <line x1="-86" y1="-26" x2="86" y2="-26"/>
      <path d="M-42,-72 L-18,-26 L0,82 L18,-26 L42,-72"/>
    </g>
  </g>
  <!-- 6. โปรไฟล์ของฉัน : คน -->
  <g transform="translate(2083.5,1173)">
    <circle cx="0" cy="-46" r="40" fill="url(#gold)"/>
    <path d="M-68,80 C-68,16 -36,4 0,4 C36,4 68,16 68,80 Z" fill="url(#gold)"/>
  </g>

  <!-- ════ LABELS ════ (มี stroke เข้มกันกลืนพื้นหลัง) -->
  <g text-anchor="middle" font-size="74" font-weight="700"
     fill="#fff4d6" stroke="#1a0533" stroke-width="7" paint-order="stroke" stroke-linejoin="round">
    <text x="416.5"  y="545">ดูดวงวันนี้</text>
    <text x="1250"   y="545">พื้นดวงของฉัน</text>
    <text x="2083.5" y="545">ไพ่ทาโรต์</text>
    <text x="416.5"  y="1388">ผูกดวงคู่</text>
    <text x="1250"   y="1388">สมัคร / ต่ออายุ</text>
    <text x="2083.5" y="1388">โปรไฟล์ของฉัน</text>
  </g>

  <!-- แถบทอง บน-ล่าง -->
  <rect x="0" y="0"    width="2500" height="8" fill="url(#gold)"/>
  <rect x="0" y="1678" width="2500" height="8" fill="url(#gold)"/>
</svg>
