<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686"
     font-family="'Leelawadee UI','Tahoma','Noto Sans Thai',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a0533"/>
      <stop offset="55%" stop-color="#241047"/>
      <stop offset="100%" stop-color="#2d0a5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f9ebc0"/>
      <stop offset="55%" stop-color="#e8c87f"/>
      <stop offset="100%" stop-color="#caa14e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#c77dff" stop-opacity="0.40"/>
      <stop offset="70%" stop-color="#9b59b6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9b59b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- พื้นหลัง -->
  <rect width="2500" height="1686" fill="url(#bg)"/>

  <!-- ดาวประดับพื้นหลัง -->
  <g fill="#f9ebc0">
    <circle cx="180"  cy="180"  r="4" opacity="0.7"/>
    <circle cx="640"  cy="120"  r="3" opacity="0.5"/>
    <circle cx="1180" cy="220"  r="3" opacity="0.6"/>
    <circle cx="1980" cy="140"  r="4" opacity="0.6"/>
    <circle cx="2360" cy="300"  r="3" opacity="0.5"/>
    <circle cx="120"  cy="640"  r="3" opacity="0.5"/>
    <circle cx="2400" cy="720"  r="4" opacity="0.6"/>
    <circle cx="300"  cy="1180" r="3" opacity="0.5"/>
    <circle cx="900"  cy="1560" r="3" opacity="0.5"/>
    <circle cx="1600" cy="1580" r="4" opacity="0.6"/>
    <circle cx="2300" cy="1480" r="3" opacity="0.5"/>
    <circle cx="2080" cy="1180" r="3" opacity="0.5"/>
  </g>
  <g fill="#f9ebc0" opacity="0.85">
    <path d="M520,1240 l5,16 16,5 -16,5 -5,16 -5,-16 -16,-5 16,-5 z"/>
    <path d="M1740,300 l6,18 18,6 -18,6 -6,18 -6,-18 -18,-6 18,-6 z"/>
    <path d="M2180,940 l5,15 15,5 -15,5 -5,15 -5,-15 -15,-5 15,-5 z"/>
  </g>

  <!-- เส้นแบ่ง 6 ช่อง (ตรงกับ tap zone: x=833.33, 1666.67 ; y=843) -->
  <g stroke="url(#gold)" stroke-opacity="0.35" stroke-width="3">
    <line x1="833.33"  y1="90" x2="833.33"  y2="1596"/>
    <line x1="1666.67" y1="90" x2="1666.67" y2="1596"/>
    <line x1="90" y1="843" x2="2410" y2="843"/>
  </g>

  <!-- glow หลังไอคอน -->
  <g>
    <circle cx="416.5"  cy="330"  r="200" fill="url(#glow)"/>
    <circle cx="1250"   cy="330"  r="200" fill="url(#glow)"/>
    <circle cx="2083.5" cy="330"  r="200" fill="url(#glow)"/>
    <circle cx="416.5"  cy="1173" r="200" fill="url(#glow)"/>
    <circle cx="1250"   cy="1173" r="200" fill="url(#glow)"/>
    <circle cx="2083.5" cy="1173" r="200" fill="url(#glow)"/>
  </g>

  <!-- ════════ ICONS ════════ -->

  <!-- 1. ดูดวงวันนี้ : พระจันทร์เสี้ยว + ดาว -->
  <g transform="translate(416.5,330)">
    <path d="M 28,-78 A 78,78 0 1 0 28,78 A 60,60 0 1 1 28,-78 Z" fill="url(#gold)"/>
    <path d="M72,-46 l8,22 22,8 -22,8 -8,22 -8,-22 -22,-8 22,-8 z" fill="url(#gold)"/>
  </g>

  <!-- 2. พื้นดวงของฉัน : ดวงอาทิตย์/รัศมี -->
  <g transform="translate(1250,330)">
    <circle r="46" fill="url(#gold)"/>
    <g stroke="url(#gold)" stroke-width="11" stroke-linecap="round">
      <line x1="0" y1="-70" x2="0" y2="-98"/>
      <line x1="0" y1="70"  x2="0" y2="98"/>
      <line x1="-70" y1="0" x2="-98" y2="0"/>
      <line x1="70"  y1="0" x2="98"  y2="0"/>
      <line x1="-52" y1="-52" x2="-72" y2="-72"/>
      <line x1="52"  y1="-52" x2="72"  y2="-72"/>
      <line x1="-52" y1="52" x2="-72" y2="72"/>
      <line x1="52"  y1="52" x2="72"  y2="72"/>
    </g>
  </g>

  <!-- 3. ไพ่ทาโรต์ : ไพ่ 3 ใบ -->
  <g transform="translate(2083.5,330)">
    <g fill="#2d0a5a" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round">
      <g transform="rotate(-18)"><rect x="-46" y="-66" width="92" height="132" rx="12"/></g>
      <g transform="rotate(18)"><rect x="-46" y="-66" width="92" height="132" rx="12"/></g>
      <g transform="rotate(0)"><rect x="-48" y="-74" width="96" height="148" rx="12"/></g>
    </g>
    <path d="M0,-34 l8,22 22,8 -22,8 -8,22 -8,-22 -22,-8 22,-8 z" fill="url(#gold)"/>
  </g>

  <!-- 4. สมัคร / ต่ออายุ : เพชร -->
  <g transform="translate(416.5,1173)">
    <path d="M-42,-72 L42,-72 L86,-26 L0,82 L-86,-26 Z" fill="url(#gold)"/>
    <g stroke="#2d0a5a" stroke-width="5" fill="none" stroke-linejoin="round">
      <line x1="-86" y1="-26" x2="86" y2="-26"/>
      <path d="M-42,-72 L-18,-26 L0,82 L18,-26 L42,-72"/>
      <line x1="-18" y1="-26" x2="18" y2="-26"/>
    </g>
  </g>

  <!-- 5. โปรไฟล์ของฉัน : คน -->
  <g transform="translate(1250,1173)">
    <circle cx="0" cy="-46" r="40" fill="url(#gold)"/>
    <path d="M-68,80 C-68,16 -36,4 0,4 C36,4 68,16 68,80 Z" fill="url(#gold)"/>
  </g>

  <!-- 6. วิธีใช้งาน : หนังสือ -->
  <g transform="translate(2083.5,1173)">
    <g fill="url(#gold)" stroke="#2d0a5a" stroke-width="5" stroke-linejoin="round">
      <path d="M0,-52 C-32,-70 -76,-66 -92,-56 L-92,60 C-76,50 -32,54 0,72 Z"/>
      <path d="M0,-52 C32,-70 76,-66 92,-56 L92,60 C76,50 32,54 0,72 Z"/>
    </g>
    <g stroke="#2d0a5a" stroke-width="4" opacity="0.6">
      <line x1="-66" y1="-34" x2="-20" y2="-28"/>
      <line x1="-66" y1="-8"  x2="-20" y2="-2"/>
      <line x1="66"  y1="-34" x2="20"  y2="-28"/>
      <line x1="66"  y1="-8"  x2="20"  y2="-2"/>
    </g>
  </g>

  <!-- ════════ LABELS ════════ -->
  <g text-anchor="middle" fill="#f6e7c2" font-size="72" font-weight="700">
    <text x="416.5"  y="540">ดูดวงวันนี้</text>
    <text x="1250"   y="540">พื้นดวงของฉัน</text>
    <text x="2083.5" y="540">ไพ่ทาโรต์</text>
    <text x="416.5"  y="1383">สมัคร / ต่ออายุ</text>
    <text x="1250"   y="1383">โปรไฟล์ของฉัน</text>
    <text x="2083.5" y="1383">วิธีใช้งาน</text>
  </g>

  <!-- แถบทองบน-ล่าง -->
  <rect x="0" y="0"    width="2500" height="10" fill="url(#gold)"/>
  <rect x="0" y="1676" width="2500" height="10" fill="url(#gold)"/>
</svg>
